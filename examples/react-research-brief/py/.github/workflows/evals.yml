# Runs your evals on every push and pull request.
# Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions.
# Cases live in evals.json (export them from the AgentSababa Lab). Each run costs real tokens, so keep the list short.
name: evals
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python evals.py
